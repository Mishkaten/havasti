let lang = 'hy';
try { lang = localStorage.getItem('lang') || (navigator.language || '').slice(0, 2); } catch (e) {}
if (!D[lang]) lang = 'hy';
function draw() {
  const d = D[lang], el = document.getElementById('doc');
  document.documentElement.lang = lang;
  el.innerHTML = '';
  const add = (tag, text, cls) => { const n = document.createElement(tag); n.textContent = text; if (cls) n.className = cls; el.appendChild(n); return n; };
  add('h1', d.title);
  add('p', d.upd);
  add('p', d.note, 'note');
  d.s.forEach(([h, p]) => { const n = add('h2', h); if (h.startsWith('11.')) n.id = 'privacy'; add('p', p); });
  document.getElementById('back').textContent = d.back;
  document.title = d.title + ' · Havasti';
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (e) {} draw(); });
draw();
</script>
